apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yahari-app-ingress
  namespace: yahari-city
  labels:
    name: yahari-app-ingress
spec:
  ingressClassName: traefik
  rules:
    - host: yahari-city.skyia.jp
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: yahari-app
                port:
                  number: 80
